apiVersion: "kubeflow.org/v1"
kind: PyTorchJob
metadata:
  name: seed-voken-ibq-32k
spec:
  elasticPolicy:
    rdzvBackend: etcd
    rdzvHost: etcd
    rdzvPort: 2379
    minReplicas: 4
    maxReplicas: 4
    maxRestarts: 1
  pytorchReplicaSpecs:
    Worker:
      replicas: 4
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: seed-voken
        spec:
          # Use the same service account that has S3 access
          serviceAccountName: torchtitan-service-account
          initContainers:
            - name: fix-scratch-perms
              image: alpine:latest
              securityContext:
                runAsUser: 0
              command: ["/bin/sh", "-c", "chmod 777 /scratch"]
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: shm
              emptyDir:
                medium: Memory
            - name: scratch
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: "local-storage"
                    resources:
                      requests:
                        storage: 20Ti
          containers:
            - name: pytorch
              # UPDATE THIS with your ECR image after building
              image: 818273938349.dkr.ecr.us-east-2.amazonaws.com/seed-voken:latest
              imagePullPolicy: Always
              resources:
                limits:
                  nvidia.com/gpu: 8
                  vpc.amazonaws.com/efa: 32
                  memory: 1500Gi # nodes actually have 1.6T, but leave a little walkin' around RAM
              env:
                # NCCL settings for EFA
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: NCCL_DEBUG
                  value: "INFO"
                - name: LOGLEVEL
                  value: "INFO"
                - name: NCCL_SOCKET_IFNAME
                  value: "eth0,en,eth,em,bond"
                - name: PYTHONFAULTHANDLER
                  value: "1"
                # Enable Gloo for CPU operations (metrics syncing)
                - name: PL_TORCH_DISTRIBUTED_BACKEND
                  value: "nccl"
                # Put stuff on local storage
                - name: TMPDIR
                  value: /scratch/tmp
                - name: HF_HOME
                  value: /scratch/hf_home
                - name: TORCH_HOME
                  value: /scratch/torch_home
                # API keys from secrets
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: charles-api-keys
                      key: hf
                - name: WANDB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: charles-api-keys
                      key: wandb
                # AWS region for S3 access
                - name: AWS_DEFAULT_REGION
                  value: "us-west-2"
              command: ["/bin/bash"]
              args:
                - "-c"
                - |
                  set -e
                  echo "Starting SEED-Voken training on $(hostname)"
                  echo "CUDA devices: $(nvidia-smi -L)"
                  echo "Storage check:"
                  df -h /scratch

                  torchrun \
                    --nproc_per_node=8 \
                    --nnodes=4 \
                    --rdzv_id=seed-voken-ibq-32k \
                    --rdzv_backend=etcd \
                    --rdzv_endpoint=etcd:2379 \
                    main.py fit \
                    --config=configs/k8s/imagenet_32k_distributed.yaml \
                    || {
                    echo "Training ended with error, sleeping for debugging..."
                    sleep 600
                  }
              volumeMounts:
                - name: shm
                  mountPath: /dev/shm
                - name: scratch
                  mountPath: /scratch
