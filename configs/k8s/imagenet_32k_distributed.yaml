seed_everything: true
trainer:
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  devices: 8
  num_nodes: 4
  precision: bf16-mixed
  max_epochs: 30
  check_val_every_n_epoch: 1
  val_check_interval: 4000
  num_sanity_val_steps: 2
  log_every_n_steps: 10
  logger:
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        project: "seed-voken"
        name: "ibq-32k-distributed"
        save_dir: "/local/logs/"
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: "/local/logs/tensorboard/"
        name: "ibq-32k"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        # S3 path for checkpoints - accessible from all nodes
        dirpath: "s3://arcee-seed-voken-checkpoints/ibq-32k/checkpoints/"
        save_top_k: 3
        save_last: true
        monitor: "train/perceptual_loss"
        every_n_epochs: 1
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "s3://arcee-seed-voken-checkpoints/ibq-32k/checkpoints/"
        save_top_k: 3
        save_last: true
        monitor: "train/perceptual_loss"
        every_n_train_steps: 1000
    - class_path:16 lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

model:
  class_path: src.IBQ.models.ibqgan.IBQ
  init_args:
    compile_model: true
    ddconfig:
      double_z: false
      z_channels: 256
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 1, 2, 2, 4]
      num_res_blocks: 4
      attn_resolutions: [16]
      dropout: 0.0

    lossconfig:
      target: src.IBQ.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_start: 0
        disc_weight: 0.4
        quant_loss_weight: 1.0
        entropy_loss_weight: 0.05
        gen_loss_weight: 0.1
        lecam_loss_weight: 0.05

    n_embed: 32768
    embed_dim: 256
    learning_rate: 3e-4
    l2_normalize: false
    use_entropy_loss: true
    sample_minimization_weight: 1.0
    batch_maximization_weight: 1.0
    entropy_temperature: 0.01
    beta: 0.25
    use_ema: true
    resume_lr:
    lr_drop_epoch: [250, 300]

data:
  class_path: main.DataModuleFromConfig
  init_args:
    # Larger batch size for 32 GPUs (48 per GPU * 32 = 1536 global batch)
    batch_size: 48
    num_workers: 32
    persistent_workers: true
    prefetch_factor: 4
    train:
      target: src.IBQ.data.huggingface.HuggingFaceStreamingDatasetTrain
      params:
        config:
          dataset_name: "parquet"
          size: 256
          image_column: "image"
          data_files:
            - "s3://arcee-seed-voken-checkpoints/data/imagenet-plus-cc12m/*.parquet"
          shuffle: true
    validation:
      target: src.IBQ.data.huggingface.HuggingFaceDatasetValidation
      params:
        config:
          dataset_name: benjamin-paine/imagenet-1k-256x256
          size: 256
    test:
      target: src.IBQ.data.huggingface.HuggingFaceDatasetTest
      params:
        config:
          dataset_name: benjamin-paine/imagenet-1k-256x256
          size: 256

ckpt_path: null
